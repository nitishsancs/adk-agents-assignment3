[project]
name = "adk-agents-assignment3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "google-adk[db]>=2.13",
    "langchain<1.3",
    "langchain-community>=0.4.2",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "pycodestyle>=2.15.0",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "python-dotenv>=1.2.4",
    "stackapi>=0.3.1",
    "toolbox-adk>=1.4.0",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
