# Local stack for parts (c) and (e):
#   postgres  pgvector + PostGIS, databases ticketsdb and storedb
#   toolbox   MCP Toolbox for Databases on :5000, serving infra/toolbox/tools.yaml
# Start with: docker compose -f infra/docker-compose.yml --env-file .env up -d --build
services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - ./sql/00-databases.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
      - ./sql/10-tickets.sql:/docker-entrypoint-initdb.d/10-tickets.sql:ro
      - ./sql/20-store.sh:/docker-entrypoint-initdb.d/20-store.sh:ro
      - ./sql/store.sql:/docker-entrypoint-initdb.d/store/store.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d storedb"]
      interval: 3s
      retries: 40

  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.15.0
    command: ["--tools-file", "/config/tools.yaml", "--address", "0.0.0.0", "--port", "5000"]
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    ports: ["5000:5000"]
    volumes:
      - ./toolbox/tools.yaml:/config/tools.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
